name: Refresh CTSV token

on:
#  schedule:
    # Chay luc 01:00, 07:00, 13:00, 19:00(cach nhau 6 tieng)
#    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run refresh script
        env:
          HUST_USERNAME: ${{ secrets.HUST_USERNAME }}
          HUST_PASSWORD: ${{ secrets.HUST_PASSWORD }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_FILENAME: token.txt
        run: python refresh_token.py
